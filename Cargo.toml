[package]
name = "jobscout"
version = "0.1.3"
edition = "2021"
description = "Zero-dependency job posting scout: polls job boards, filters, and bundles new postings into digests"
license = "MIT"
repository = "https://github.com/juniorinyang-spec/jobscout"
readme = "README.md"
keywords = ["jobs", "scraper", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "jobscout"
path = "src/main.rs"

# Deliberately empty: everything is built on the standard library.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
