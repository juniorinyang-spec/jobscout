name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: ./target/release/jobscout --version

  # On a tag push, print the sha256 Homebrew needs for the release tarball.
  formula-sha:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: |
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          echo "url \"${URL}\""
          echo "sha256 \"$(curl -sL "${URL}" | sha256sum | cut -d' ' -f1)\""
