name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - run: cargo test --locked
      - run: ./target/release/jobscout --version
      - name: Plugin and installer stay in step with the crate
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          grep -q "\"version\": \"$v\"" plugins/jobscout/.claude-plugin/plugin.json || { echo "plugin.json version != $v"; exit 1; }
          grep -q "^VERSION=\"$v\"" plugins/jobscout/scripts/jobscout-mcp || { echo "jobscout-mcp VERSION != $v"; exit 1; }
          cmp install.sh plugins/jobscout/scripts/install.sh || { echo "plugins/jobscout/scripts/install.sh differs from install.sh"; exit 1; }

  # ---- releases: on a v* tag, build binaries and attach them to a GitHub release

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "jobscout $GITHUB_REF_NAME" --generate-notes
      - name: Print the Homebrew formula fields for this tag
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          echo "url \"${URL}\""
          echo "sha256 \"$(curl -sL "${URL}" | sha256sum | cut -d' ' -f1)\""

  build-binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Build Linux on the oldest supported Ubuntu: the binary needs the
          # glibc it was linked against or newer (22.04 -> glibc 2.35, so it
          # also runs on Debian 12, RHEL 9, Ubuntu 22.04+).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        # No version in the asset name, so .../releases/latest/download/<name>
        # in the README keeps pointing at the newest release.
        run: |
          NAME="jobscout-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/jobscout" README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  # ---- Claude Desktop extension: one universal macOS binary in a .mcpb bundle

  desktop-extension:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the two macOS builds from the release
        run: |
          mkdir -p dl
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            gh release download "$GITHUB_REF_NAME" --pattern "jobscout-$t.tar.gz" --dir dl
            tar -xzf "dl/jobscout-$t.tar.gz" -C dl
          done
      - name: Build jobscout.mcpb
        run: |
          sh mcpb/build.sh "$GITHUB_REF_NAME" dl/jobscout-aarch64-apple-darwin/jobscout dl/jobscout-x86_64-apple-darwin/jobscout dist/jobscout.mcpb
          (cd dist && shasum -a 256 jobscout.mcpb > jobscout.mcpb.sha256)
      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/jobscout.mcpb dist/jobscout.mcpb.sha256 --clobber
